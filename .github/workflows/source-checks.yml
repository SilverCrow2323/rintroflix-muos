name: Source sanity checks
on:
  push:
    branches: [main]
    paths:
      - "rintroflix/**"
      - "lib/**"
      - "mux_launch.sh"
      - "tests/**"
      - ".github/workflows/source-checks.yml"
  pull_request:
    paths:
      - "rintroflix/**"
      - "lib/**"
      - "mux_launch.sh"
      - "tests/**"
      - ".github/workflows/source-checks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-sanity:
    name: Compile application and test add-on archive safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify runtime entry points
        run: |
          test -f rintroflix/main.py
          test -f rintroflix/ui.py
          test -f rintroflix/player.py
          test -f mux_launch.sh
      - name: Compile Python application and tests
        run: python -m compileall -q rintroflix tests
      - name: Test add-on archive validation and staging
        run: python -m unittest tests.test_addon_archive_security
      - name: Validate shell scripts
        run: |
          bash -n mux_launch.sh
          bash -n lib/glyph_install.sh
      - name: Verify imported core modules
        run: |
          test -f rintroflix/config.py
          test -f rintroflix/net.py
          test -f rintroflix/m3u.py
          test -f rintroflix/epg.py
          test -f rintroflix/addons.py
          test -f rintroflix/repository.py
          test -f rintroflix/input.py
          test -f rintroflix/fbdisplay.py
          test -f rintroflix/logos.py
