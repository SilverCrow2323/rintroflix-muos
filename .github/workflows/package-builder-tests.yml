name: Package builder security tests
on:
  push:
    paths:
      - "tools/build_muxapp.py"
      - "tests/**"
      - ".github/workflows/package-builder-tests.yml"
  pull_request:
    paths:
      - "tools/build_muxapp.py"
      - "tests/**"
      - ".github/workflows/package-builder-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run package source safety tests
        run: python -m unittest discover -s tests -v
